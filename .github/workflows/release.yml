name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Golang with cache
        uses: magnetikonline/action-golang-cache@v5
        with:
          go-version: ~1.25

      - name: dependencies
        run: |
          go mod download
          go install gioui.org/cmd/gogio@latest

      - name: build
        id: build
        run: |
          go run ./build.go windows gui,cli

      - name: 🏷️ Create/update tag
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'refs/tags/${{ steps.build.outputs.release_tag }}',
              sha: context.sha
            }).catch(err => {
              if (err.status !== 422) throw err;
              github.rest.git.updateRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: 'tags/${{ steps.build.outputs.release_tag }}',
                sha: context.sha
              });
            })

      - uses: ncipollo/release-action@v1
        with:
          artifacts: ./builds/*
          bodyFile: changelog.txt
          removeArtifacts: true
          replacesArtifacts: true
          allowUpdates: true
          makeLatest: ${{ steps.build.outputs.is_latest }}
          tag: ${{ steps.build.outputs.release_tag }}
